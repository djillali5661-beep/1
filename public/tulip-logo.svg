<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Tulip Petal Gradients matching the official logo -->
    <linearGradient id="leftPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f7a" />
      <stop offset="45%" stop-color="#d92672" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="rightPetal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f7a" />
      <stop offset="45%" stop-color="#d92672" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="centerPetal" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#d92672" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Architectural Background -->
  <rect width="500" height="500" fill="#0c1017" rx="24" />

  <!-- Background Tile Subtle Grid Lines -->
  <line x1="0" y1="250" x2="500" y2="250" stroke="#1f293d" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="250" y1="0" x2="250" y2="500" stroke="#1f293d" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 3-Petal Tulip Flower Icon -->
  <g filter="url(#subtleShadow)" transform="translate(0, -10)">
    <!-- Central Top Petal / Bud -->
    <path
      d="M 250 82 
         C 268 112 284 136 284 160 
         C 284 185 270 205 250 216 
         C 230 205 216 185 216 160 
         C 216 136 232 112 250 82 Z"
      fill="url(#centerPetal)"
    />

    <!-- Left Outer Curved Petal -->
    <path
      d="M 238 214 
         C 205 204 175 168 185 132 
         C 192 108 218 100 236 128 
         C 246 144 252 176 238 214 Z"
      fill="url(#leftPetal)"
    />

    <!-- Right Outer Curved Petal -->
    <path
      d="M 262 214 
         C 295 204 325 168 315 132 
         C 308 108 282 100 264 128 
         C 254 144 248 176 262 214 Z"
      fill="url(#rightPetal)"
    />

    <!-- Inner Core Petal Stylized Curve (Organic separation) -->
    <path
      d="M 250 148
         C 257 165 260 188 250 205
         C 240 188 243 165 250 148 Z"
      fill="#500724"
      opacity="0.55"
    />
  </g>

  <!-- "TULIP" Display Typography -->
  <text
    x="250"
    y="335"
    text-anchor="middle"
    font-family="'Playfair Display', 'Cinzel', 'Georgia', serif"
    font-size="64"
    font-weight="700"
    letter-spacing="6"
    fill="#ffffff"
    filter="url(#subtleShadow)"
  >
    TULIP
  </text>

  <!-- "FRAGRANCE COMPANY" Sub-label -->
  <text
    x="250"
    y="375"
    text-anchor="middle"
    font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="9"
    fill="#f1f5f9"
    opacity="0.9"
  >
    FRAGRANCE COMPANY
  </text>
</svg>
