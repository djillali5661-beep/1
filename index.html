    <script>
      // Suppress benign [vite] websocket connection notice when HMR is disabled in AI Studio dev environment
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        const isViteHmrNotice = function(args) {
          try {
            const msg = args.map(function(a) { return String(a || ''); }).join(' ');
            return msg.includes('[vite]') && (msg.includes('websocket') || msg.includes('failed to connect') || msg.includes('connecting'));
          } catch(e) {
            return false;
          }
        };
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (isViteHmrNotice(args)) return;
          return origError.apply(console, args);
        };
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          if (isViteHmrNotice(args)) return;
          return origWarn.apply(console, args);
        };
      })();
    </script>

  <body>

    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }
    </script>
